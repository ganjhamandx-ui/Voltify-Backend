<aside
    class="dashboard-sidebar"
    id="dashboardSidebar"
>

    <div class="sidebar-brand">

        <div class="sidebar-logo">

            <svg
                viewBox="0 0 48 58"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >
                <path
                    d="
                        M28 3
                        L8 31
                        H22
                        L17 54
                        L40 23
                        H25
                        Z
                    "
                />
            </svg>

        </div>

        <h1 class="sidebar-brand-text">
            Voltify
        </h1>

    </div>


    <nav class="sidebar-nav">

        <!-- Dashboard -->

        <a
            href="{% url 'inicio' %}"
            class="sidebar-link
            {% if activa == 'dashboard' %}
                active
            {% endif %}"
        >

            <span class="sidebar-icon">

                <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path d="M3 11.5L12 4l9 7.5"/>
                    <path d="M5 10.5V20h14v-9.5"/>
                    <path d="M9 20v-6h6v6"/>
                </svg>

            </span>

            <span>
                Dashboard
            </span>

        </a>


        <!-- Consumos -->

        <a
            href="{% url 'lista_consumos' %}"
            class="sidebar-link
            {% if activa == 'consumos' %}
                active
            {% endif %}"
        >

            <span class="sidebar-icon">

                <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path d="M4 19V9"/>
                    <path d="M10 19V5"/>
                    <path d="M16 19v-7"/>
                    <path d="M22 19V3"/>
                </svg>

            </span>

            <span>
                Consumos
            </span>

        </a>


        <!-- Artefactos -->

        <a
            href="{% url 'lista_artefactos' %}"
            class="sidebar-link
            {% if activa == 'artefactos' %}
                active
            {% endif %}"
        >

            <span class="sidebar-icon">

                <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <rect
                        x="5"
                        y="3"
                        width="14"
                        height="18"
                        rx="2"
                    />

                    <path d="M9 7h6"/>
                    <path d="M9 17h6"/>
                </svg>

            </span>

            <span>
                Artefactos
            </span>

        </a>


        <!-- Consejos -->

        <a
            href="{% url 'consejos' %}"
            class="sidebar-link
            {% if activa == 'consejos' %}
                active
            {% endif %}"
        >

            <span class="sidebar-icon">

                <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path d="M9 18h6"/>
                    <path d="M10 22h4"/>

                    <path
                        d="
                            M8.5 14.5
                            C6.9 13.4 6 11.6 6 9.5
                            A6 6 0 0 1 18 9.5
                            C18 11.6 17.1 13.4 15.5 14.5
                            C14.8 15 14.4 15.7 14.3 16
                            H9.7
                            C9.6 15.7 9.2 15 8.5 14.5
                        "
                    />
                </svg>

            </span>

            <span>
                Consejos
            </span>

        </a>


        <!-- Metas -->

        <a
            href="{% url 'metas' %}"
            class="sidebar-link
            {% if activa == 'metas' %}
                active
            {% endif %}"
        >

            <span class="sidebar-icon">

                <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <circle
                        cx="12"
                        cy="12"
                        r="8"
                    />

                    <circle
                        cx="12"
                        cy="12"

                    />

                    width="22"

                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"

                    <path d="M5 21V9"/>
                    <path d="M10 21V3"/>
                    <path d="M15 21v-6"/>
                    <path d="M20 21v-10"/>
                </svg>

            </span>

            <span>

            </span>

                    fill="none"

                    stroke-width="1.8"

                    <circle

                        cy="12"
                        r="3"
                    />

                    <path d="M12 2v3"/>
                    <path d="M12 19v3"/>
                    <path d="M4.9 4.9 7 7"/>
                    <path d="m17 17 2.1 2.1"/>
                    <path d="M2 12h3"/>
                    <path d="M19 12h3"/>
                    <path d="m4.9 19.1 2.1-2.1"/>
                    <path d="m17 7 2.1-2.1"/>

    <div class="sidebar-bottom">

        <div class="sidebar-eco-card">

            <div class="sidebar-eco-icon">

                <svg
                    width="34"
                    height="34"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                >
                    <path d="M12 21V10"/>

                    <path
                        d="
                            M12 14
                            C8 14 5 11 5 7
                            c4 0 7 3 7 7
                            z
                        "
                    />

                    <path
                        d="
                            M12 12
                            c0-5 3-8 7-9
                            0 5-3 8-7 9
                            z
                        "
                    />

            </div>

            <p>
                Hogares más conscientes

            </p>

        <a
            href="{% url 'cerrar_sesion' %}"
            class="sidebar-link"
            style="margin-top: 12px;"
        >

            <span class="sidebar-icon">

                <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path d="M10 17l5-5-5-5"/>
                    <path d="M15 12H3"/>
                    <path d="M14 3h6v18h-6"/>
